<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>星际殖民地 V8</title>
<style>
:root{--bg:#0a0e1a;--card:#111827;--border:#1e3a5f;--accent:#00d4ff;--accent2:#7c3aed;--red:#ef4444;--green:#22c55e;--gold:#fbbf24;--text:#e2e8f0;--muted:#64748b;--sidebar-w:180px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14px;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;-webkit-tap-highlight-color:transparent}
#app{display:flex;height:100vh}
#sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#0d1526,#111827);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;transition:transform .3s;z-index:100}
#sidebar h2{padding:12px;font-size:16px;color:var(--accent);text-align:center;border-bottom:1px solid var(--border)}
.nav-item{padding:9px 14px;cursor:pointer;transition:all .2s;border-left:3px solid transparent;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nav-item:hover,.nav-item.active{background:rgba(0,212,255,.1);border-left-color:var(--accent);color:var(--accent)}
#main{flex:1;overflow-y:auto;padding:12px;position:relative;-webkit-overflow-scrolling:touch}
#topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--card);border-radius:8px;margin-bottom:10px;flex-wrap:wrap;gap:4px}
#topbar .resources{display:flex;gap:8px;font-size:12px;flex-wrap:wrap}
#topbar .res{display:flex;align-items:center;gap:2px}
#topbar .res .val{font-weight:bold;font-size:13px}
#topbar .datetime{color:var(--accent);font-size:13px;font-weight:bold;white-space:nowrap}
#topbar .daily-event{color:var(--gold);font-size:12px;font-weight:bold;background:rgba(251,191,36,.1);padding:2px 8px;border-radius:4px;border:1px solid rgba(251,191,36,.3);white-space:nowrap}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px}
.card h3{color:var(--accent);margin-bottom:6px;font-size:15px}
.btn{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;touch-action:manipulation}
.btn-primary{background:var(--accent);color:#000}.btn-primary:hover{filter:brightness(1.2)}
.btn-danger{background:var(--red);color:#fff}.btn-green{background:var(--green);color:#fff}
.btn-gold{background:var(--gold);color:#000}.btn-accent2{background:var(--accent2);color:#fff}
.btn-sm{padding:4px 8px;font-size:11px}
.btn:disabled{opacity:0.5;cursor:not-allowed}
input,select,textarea{background:#1a2332;border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-size:13px;width:100%;margin:2px 0}
textarea{min-height:50px;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:5px 6px;border-bottom:1px solid var(--border);text-align:left}
th{color:var(--accent);font-weight:600;font-size:11px}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--muted)}
.stock-row{cursor:pointer;transition:background .2s}.stock-row:hover{background:rgba(0,212,255,.05)}
.tab-bar{display:flex;gap:3px;margin-bottom:8px;overflow-x:auto;flex-wrap:wrap}
.tab-btn{padding:4px 10px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:transparent;color:var(--muted);font-size:11px;white-space:nowrap}
.tab-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
#kline-canvas{background:#0d1117;border-radius:6px;width:100%;height:220px}
.login-box{max-width:360px;margin:60px auto;text-align:center;padding:0 16px}
.login-box h1{color:var(--accent);margin-bottom:16px;font-size:22px}
.login-box input{margin:4px 0}
.notif-badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 5px;font-size:10px;margin-left:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.flex-gap{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.progress-bar{background:#1a2332;border-radius:4px;height:14px;overflow:hidden;position:relative}
.progress-bar .fill{height:100%;border-radius:4px;transition:width .3s}
.progress-bar .label{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:10px;line-height:14px;color:#fff;font-weight:bold}
#chat-panel{background:var(--card);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;height:calc(100vh - 110px)}
#chat-messages{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch}
.chat-msg{padding:5px 8px;border-radius:6px;font-size:12px;max-width:88%}
.chat-msg.npc{background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.3);align-self:flex-start}
.chat-msg.user{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.2);align-self:flex-end}
.chat-msg .author{font-weight:bold;font-size:11px;margin-bottom:1px}
.chat-msg .time{font-size:9px;color:var(--muted);margin-left:6px}
#chat-input-bar{display:flex;gap:4px;padding:6px;border-top:1px solid var(--border)}
#chat-input-bar input{flex:1;margin:0}
.npc-personality{display:inline-block;padding:2px 6px;border-radius:10px;font-size:10px;font-weight:bold;margin-left:3px}
.npc-personality.trader{background:rgba(251,191,36,.2);color:var(--gold)}
.npc-personality.miner{background:rgba(34,197,94,.2);color:var(--green)}
.npc-personality.scholar{background:rgba(0,212,255,.2);color:var(--accent)}
.npc-personality.warrior{background:rgba(239,68,68,.2);color:var(--red)}
.npc-personality.merchant{background:rgba(124,58,237,.2);color:var(--accent2)}
.god-log{font-size:11px;padding:3px 6px;border-left:3px solid var(--gold);margin:3px 0;background:rgba(251,191,36,.05)}
.territory-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;margin:3px 0;transition:all .2s}
.territory-card.mine{border-color:var(--accent);background:rgba(0,212,255,.05)}
.territory-card .owner-tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:bold}
.territory-card .owner-tag.free{background:rgba(100,116,139,.2);color:var(--muted)}
.territory-card .owner-tag.owned{background:rgba(0,212,255,.2);color:var(--accent)}
.territory-card .owner-tag.mine-tag{background:rgba(34,197,94,.2);color:var(--green)}
/* V7 新增样式 */
.cooldown-timer{color:var(--gold);font-size:12px;font-weight:bold}
.limit-badge{font-size:10px;font-weight:bold;padding:1px 4px;border-radius:3px;margin-left:3px}
.limit-up{background:rgba(239,68,68,.2);color:var(--red)}
.limit-down{background:rgba(34,197,94,.2);color:var(--green)}
.toast{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);color:var(--gold);padding:8px 16px;border-radius:8px;font-size:13px;z-index:1000;animation:fadeInOut 3s}
@keyframes fadeInOut{0%{opacity:0;transform:translateX(-50%) translateY(-10px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
.stock-notification{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:6px;padding:6px 10px;margin-bottom:8px;font-size:12px;color:var(--gold)}
.ipo-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px}
.ipo-row:last-child{border-bottom:none}
.daily-event-card{background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(0,212,255,.1));border:1px solid rgba(251,191,36,.3);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.daily-event-card .event-title{color:var(--gold);font-weight:bold;font-size:14px}
.daily-event-card .event-desc{color:var(--text);font-size:12px;margin-top:2px}
/* 手机端侧边栏 */
#menu-toggle{display:none;position:fixed;top:8px;left:8px;z-index:200;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--accent);font-size:18px;cursor:pointer}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90}
@media(max-width:768px){
  #menu-toggle{display:block}
  #sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #sidebar-overlay.show{display:block}
  #main{padding:8px;padding-top:44px}
  .login-box{margin:30px auto}
  .login-box h1{font-size:20px}
  table{font-size:11px}
  th,td{padding:3px 4px}
  .card{padding:10px}
  .card h3{font-size:14px}
  .btn{padding:5px 10px;font-size:11px}
  input,select,textarea{font-size:14px;padding:8px 10px}
  .grid2{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  #kline-canvas{height:180px}
  #chat-panel{height:calc(100vh - 100px)}
  #topbar .resources{gap:6px;font-size:11px}
  #topbar .datetime{font-size:11px}
  .territory-card{padding:6px}
  .orderbook{flex-direction:column}
  #topbar .daily-event{font-size:10px;padding:1px 5px}
}
/* V8 战争纪元 样式 */
.raid-target{border:1px solid var(--border);border-radius:6px;padding:8px;margin:4px 0;cursor:pointer;transition:all .2s;display:flex;justify-content:space-between;align-items:center}
.raid-target:hover{border-color:var(--red);background:rgba(239,68,68,.05)}
.raid-target.has-bounty{border-color:var(--gold);box-shadow:0 0 8px rgba(251,191,36,.3)}
.formation-btn{padding:6px 12px;border:2px solid var(--border);border-radius:6px;cursor:pointer;background:transparent;color:var(--text);font-size:12px;transition:all .2s}
.formation-btn.selected{border-color:var(--accent);background:rgba(0,212,255,.1);color:var(--accent)}
.defense-slot{background:var(--card);border:2px dashed var(--border);border-radius:8px;padding:8px;text-align:center;min-height:60px}
.defense-slot.occupied{border-style:solid;border-color:var(--accent2)}
.battle-report{border-left:3px solid var(--red);padding:6px 8px;margin:4px 0;background:rgba(239,68,68,.05);cursor:pointer;transition:all .2s}
.battle-report.victory{border-left-color:var(--green);background:rgba(34,197,94,.05)}
.battle-report.unread{font-weight:bold}
.shield-badge{display:inline-block;background:rgba(0,212,255,.2);color:var(--accent);padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.bounty-amount{color:var(--gold);font-weight:bold;font-size:16px}
.arena-rank{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--border)}
.arena-rank .rank-num{width:24px;font-weight:bold;color:var(--gold)}
.spy-op{padding:8px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:transparent;color:var(--text);width:100%;text-align:left;margin:3px 0;transition:all .2s}
.spy-op:hover{border-color:var(--accent2);background:rgba(124,58,237,.05)}
.notif-bell{cursor:pointer;font-size:18px;position:relative}
.notif-dropdown{position:absolute;right:0;top:30px;width:320px;max-height:400px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:8px;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.notif-item{padding:8px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer}
.notif-item.unread{background:rgba(0,212,255,.05)}
.notif-item:hover{background:rgba(255,255,255,.03)}
.war-score-bar{display:flex;height:20px;border-radius:10px;overflow:hidden;margin:4px 0}
.war-score-bar .atk-score{background:var(--red);transition:width .3s}
.war-score-bar .def-score{background:var(--accent);transition:width .3s}
.phase-timeline{border-left:2px solid var(--border);padding-left:12px;margin:6px 0}
.phase-step{padding:4px 0;font-size:12px}
.phase-step::before{content:"●";margin-right:6px}
.phase-step.win::before{color:var(--green)}
.phase-step.lose::before{color:var(--red)}
.phase-step.shield::before{color:var(--accent)}
</style>
</head>
<body>
<div id="menu-toggle" onclick="toggleSidebar()">☰</div>
<div id="sidebar-overlay" onclick="toggleSidebar()"></div>
<div id="app">
<div id="sidebar">
<h2>🌌 星际殖民地</h2>
<div class="nav-item" onclick="showPanel('colony')">🏠 殖民地</div>

<div class="nav-item" onclick="showPanel('arena')">🏟️ 竞技场</div>

<div style="flex:1"></div>

</div>
<div id="main">
<div id="topbar">
<div class="resources" id="res-bar"></div>
<div class="daily-event" id="daily-event-bar" style="display:none"></div>
<div class="datetime" id="datetime"></div>
<div style="position:relative" id="notif-center">
<span class="notif-bell" onclick="toggleNotif()">🔔<span class="notif-badge" id="notif-count" style="display:none">0</span></span>
<div class="notif-dropdown" id="notif-dropdown" style="display:none"></div>
</div>
</div>
<div id="login-screen">
<div class="login-box">
<h1>🌌 星际殖民地</h1>
<div id="login-form">
<input id="l_user" placeholder="用户名" autocomplete="username">
<input id="l_pass" type="password" placeholder="密码" autocomplete="current-password">
<button class="btn btn-primary" style="width:100%;margin-top:6px" onclick="doLogin()">登录</button>
<p style="margin-top:10px;color:var(--muted);font-size:12px">没有账号？<a href="#" onclick="document.getElementById('login-form').style.display='none';document.getElementById('reg-form').style.display='block';return false" style="color:var(--accent)">注册</a></p>
</div>

<input id="r_user" placeholder="用户名（≥2位）">
<input id="r_email" placeholder="邮箱">
<input id="r_pass" type="password" placeholder="密码（≥6位）">
<input id="r_colony" placeholder="殖民地名称">
<select id="r_planet"><option value="terran">类地星球</option><option value="gas">气态星球</option><option value="ice">冰冻星球</option><option value="volcanic">火山星球</option></select>

<script>
let token='',uid=0,cid=0,colony=null,chatTimer=null,chatLastId=0;
let collectCooldown=0,collectTimer=null;
let terrCollectCooldowns={},terrCollectTimers={};
let currentDailyEvent=null;
let stockNotifications=[];
const API=window.location.origin+'/api';
const RES_NAMES={minerals:'矿物',energy:'能量',food:'食物',gold:'金币',rare_metals:'稀有金属',crystals:'水晶',plasma:'等离子体',dark_matter:'暗物质',antimatter:'反物质',culture:'文化',score:'积分'};
const RES_ICONS={minerals:'⛏️',energy:'⚡',food:'🌾',gold:'🪙',score:'⭐'};
const SPEC_NAMES={military:'军事⚔️',economic:'经济💰',cultural:'文化🎭',research:'科研🔬',none:'未选择'};
const NPC_STYLES={trader:'星商💰',miner:'矿工⛏️',scholar:'学者📚',warrior:'战士⚔️',merchant:'商人🏪'};

// ============ Toast 通知 ============
function showToast(msg, duration){
    duration = duration || 3000;
    const t=document.createElement('div');
    t.className='toast';
    t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>{if(t.parentNode)t.parentNode.removeChild(t)},duration);
}

// ============ 时间显示 ============
function updateClock(){
    const now=new Date();
    const y=now.getFullYear(),m=String(now.getMonth()+1).padStart(2,'0'),d=String(now.getDate()).padStart(2,'0');
    const h=String(now.getHours()).padStart(2,'0'),mi=String(now.getMinutes()).padStart(2,'0'),s=String(now.getSeconds()).padStart(2,'0');
    document.getElementById('datetime').textContent=`📅${y}年${m}月${d}日 ${h}:${mi}:${s}`;
}
setInterval(updateClock,1000);updateClock();

// ============ 侧边栏 ============
function toggleSidebar(){
    const sb=document.getElementById('sidebar'),ov=document.getElementById('sidebar-overlay');
    sb.classList.toggle('open');ov.classList.toggle('show');
}

// ============ Auth ============
let api401Count=0;
async function api(path,opts={}){
    const h={'Content-Type':'application/json'};
    if(token)h['Authorization']='Bearer '+token;
    try{
        const r=await fetch(API+path,{...opts,headers:{...h,...(opts.headers||{})}});
        if(r.status===401){
            api401Count++;
            if(api401Count>3){token='';uid=0;localStorage.removeItem('sc_token');localStorage.removeItem('sc_uid');document.getElementById('login-screen').style.display='block';document.getElementById('game-content').style.display='none';}
            return null;
        }
        api401Count=0;
        if(r.status===400){
            const data=await r.json();
            throw new Error(data.detail||data.message||'操作失败');
        }
        if(!r.ok){
            const data=await r.json().catch(()=>({}));
            throw new Error(data.detail||data.message||`请求失败(${r.status})`);
        }
        return r.json();
    }catch(e){
        if(e.message&&e.message!=='操作失败'&&!e.message.startsWith('请求失败'))throw e;
        return null;
    }
}
async function doLogin(){
    token='';uid=0;localStorage.removeItem('sc_token');localStorage.removeItem('sc_uid');
    try{
        const r=await api('/login',{method:'POST',body:JSON.stringify({username:l_user.value,password:l_pass.value})});
        if(r&&r.access_token){token=r.access_token;uid=r.user_id;localStorage.setItem('sc_token',token);localStorage.setItem('sc_uid',uid);api401Count=0;enterGame()}
        else alert('登录失败，请检查用户名和密码');
    }catch(e){alert(e.message||'登录失败');}
}
async function doRegister(){
    token='';uid=0;localStorage.removeItem('sc_token');localStorage.removeItem('sc_uid');
    try{
        const r=await api('/register',{method:'POST',body:JSON.stringify({username:r_user.value,email:r_email.value,password:r_pass.value,colony_name:r_colony.value,planet_type:r_planet.value})});
        if(r&&r.access_token){token=r.access_token;uid=r.user_id;localStorage.setItem('sc_token',token);localStorage.setItem('sc_uid',uid);api401Count=0;enterGame()}

// V7: 收取资源冷却系统
async function doCollect(){
    try{
        const r=await api('/colony/collect',{method:'POST'});
        if(r){
            showToast(`收取${r.collected_hours}小时产出：矿+${r.gains.minerals} 能+${r.gains.energy} 食+${r.gains.food} 金+${r.gains.gold}`);
            startCollectCooldown(60);
            loadColony();
        }
    }catch(e){
        if(e.message&&e.message.includes('冷却中')){
            const match=e.message.match(/(\d+)秒/);
            if(match)startCollectCooldown(parseInt(match[1]));
            else startCollectCooldown(60);
            showToast(e.message);
        }else{
            alert(e.message||'收取失败');
        }
    }
}

function startCollectCooldown(seconds){
    collectCooldown=seconds;
    const btn=document.getElementById('collect-btn');
    const display=document.getElementById('collect-cooldown-display');
    if(btn){
        btn.disabled=true;
        btn.textContent=`冷却中 (${seconds}s)`;
    }
    if(display)display.textContent=`冷却剩余: ${seconds}s`;
    if(collectTimer)clearInterval(collectTimer);
    collectTimer=setInterval(()=>{
        collectCooldown--;
        if(collectCooldown<=0){
            clearInterval(collectTimer);
            collectTimer=null;
            if(btn){btn.disabled=false;btn.textContent='💰 收取资源';}
            if(display)display.textContent='';
        }else{
            if(btn)btn.textContent=`冷却中 (${collectCooldown}s)`;
            if(display)display.textContent=`冷却剩余: ${collectCooldown}s`;
        }
    },1000);
}

async function stockTrade(code,dir){
    // V7: 涨停/跌停限制检查
    const detailR=await api('/stocks/detail/'+code);
    if(detailR&&detailR.stock){
        if(dir==='buy'&&detailR.stock.change_pct>=9.9){
            showToast('该股已涨停，无法买入');
            return;
        }
        if(dir==='sell'&&detailR.stock.change_pct<=-9.9){
            showToast('该股已跌停，无法卖出');
            return;
        }
    }
    const amt=parseInt(document.getElementById('st-amount')?.value||100);
    try{
        const r=await api('/stocks/trade',{method:'POST',body:JSON.stringify({code,direction:dir,amount:amt})});
        if(r){alert(r.msg);showStockDetail(code)}
    }catch(e){
        if(e.message&&e.message.includes('涨停')){showToast('该股已涨停，无法买入');}
        else if(e.message&&e.message.includes('跌停')){showToast('该股已跌停，无法卖出');}
        else{alert(e.message||'交易失败');}
    }
}

function drawKline(klines){const c=document.getElementById('kline-canvas');if(!c||!klines.length)return;const ctx=c.getContext('2d');c.width=c.offsetWidth;c.height=c.offsetHeight;const w=c.width,kh=c.height,prices=klines.map(k=>[Number(k.open_price),Number(k.high_price),Number(k.low_price),Number(k.close_price)]),hi=Math.max(...prices.flat()),lo=Math.min(...prices.flat()),rng=hi-lo||1,bw=Math.max(2,w/klines.length-1);ctx.clearRect(0,0,w,kh);klines.forEach((k,i)=>{const x=i*(bw+1),o=kh-(prices[i][0]-lo)/rng*(kh-20)-10,cl=kh-(prices[i][3]-lo)/rng*(kh-20)-10,h=kh-(prices[i][1]-lo)/rng*(kh-20)-10,l=kh-(prices[i][2]-lo)/rng*(kh-20)-10,up=prices[i][3]>=prices[i][0];ctx.strokeStyle=up?'#ef4444':'#22c55e';ctx.fillStyle=up?'rgba(239,68,68,.3)':'rgba(34,197,94,.3)';ctx.fillRect(x,Math.min(o,cl),bw,Math.abs(cl-o)||1);ctx.beginPath();ctx.moveTo(x+bw/2,h);ctx.lineTo(x+bw/2,l);ctx.stroke()})}

async function doTerrCollect(id){
    try{
        const r=await api('/territories/'+id+'/collect',{method:'POST'});
        if(r){
            showToast(r.msg||'收取成功');
            startTerrCollectCooldown(id,60);
            loadColony();
        }
    }catch(e){
        if(e.message&&e.message.includes('冷却中')){
            const match=e.message.match(/(\d+)秒/);
            if(match)startTerrCollectCooldown(id,parseInt(match[1]));
            else startTerrCollectCooldown(id,60);
            showToast(e.message);
        }else{
            alert(e.message||'收取失败');
        }
    }
}

function startTerrCollectCooldown(terrId,seconds){
    terrCollectCooldowns[terrId]=seconds;
    const btn=document.getElementById(`terr-collect-${terrId}`);
    const display=document.getElementById(`terr-cooldown-${terrId}`);
    if(btn){
        btn.disabled=true;
        btn.textContent=`冷却中 (${seconds}s)`;
    }
    if(display)display.textContent=`冷却剩余: ${seconds}s`;
    if(terrCollectTimers[terrId])clearInterval(terrCollectTimers[terrId]);
    terrCollectTimers[terrId]=setInterval(()=>{
        terrCollectCooldowns[terrId]--;
        if(terrCollectCooldowns[terrId]<=0){
            clearInterval(terrCollectTimers[terrId]);
            delete terrCollectTimers[terrId];
            terrCollectCooldowns[terrId]=0;
            if(btn){btn.disabled=false;btn.textContent='📦 收取';}
            if(display)display.textContent='';
        }else{
            if(btn)btn.textContent=`冷却中 (${terrCollectCooldowns[terrId]}s)`;
            if(display)display.textContent=`冷却剩余: ${terrCollectCooldowns[terrId]}s`;
        }
    },1000);
}

    </div></div>`;
    document.getElementById('panel-chat').innerHTML=h;
    await loadChatHistory();
    if(chatTimer)clearInterval(chatTimer);
    chatTimer=setInterval(pollChat,3000);

async function loadChatHistory(){
    const r=await api('/chat/history?limit=50');if(!r)return;
    const el=document.getElementById('chat-messages');if(!el)return;
    el.innerHTML='';
    (r.messages||[]).forEach(m=>{chatLastId=Math.max(chatLastId,m.id);appendChatMsg(m)});
    el.scrollTop=el.scrollHeight;
}
async function pollChat(){
    const r=await api('/chat/history?limit=20');if(!r)return;
    const el=document.getElementById('chat-messages');if(!el)return;
    let newMsgs=false;
    (r.messages||[]).forEach(m=>{if(m.id>chatLastId){chatLastId=m.id;appendChatMsg(m);newMsgs=true}});
    if(newMsgs)el.scrollTop=el.scrollHeight;
}
function appendChatMsg(m){
    const el=document.getElementById('chat-messages');if(!el)return;
    const cls=m.is_npc?'npc':'user';
    const npcTag=m.is_npc?'<span style="color:var(--accent2);font-size:9px">[NPC]</span> ':'';
    const time=new Date(m.created_at).toLocaleTimeString();
    el.innerHTML+=`<div class="chat-msg ${cls}"><div class="author">${npcTag}${m.author_name} <span class="time">${time}</span></div><div>${m.message}</div></div>`;
}
async function sendChat(){
    const inp=document.getElementById('chat-input');if(!inp||!inp.value.trim())return;
    const r=await api('/chat/send',{method:'POST',body:JSON.stringify({message:inp.value.trim()})});
    if(r){inp.value='';chatLastId=r.id;const el=document.getElementById('chat-messages');
    if(el){el.innerHTML+=`<div class="chat-msg user"><div class="author">${r.author_name} <span class="time">${new Date().toLocaleTimeString()}</span></div><div>${r.message}</div></div>`;el.scrollTop=el.scrollHeight}}
}

        h+=`<div class="card" style="padding:6px;${a.unlocked?'border-color:var(--gold)':''}">${unlocked} <b>${a.name}</b><br><small style="color:var(--muted)">${a.description}</small><br><small>奖励: ${a.reward_gold}金 ${a.reward_score}分</small></div>`;
    });

// ============ Daily Tasks ============
async function loadDailyTasks(){
    const r=await api('/daily_tasks');if(!r)return;
    let h=`<div class="card"><h3>📋 每日任务</h3><p style="color:var(--muted);font-size:12px;margin-bottom:6px">每日刷新，完成任务获得奖励</p>`;
    if(!r.tasks||r.tasks.length===0){
        h+=`<p style="color:var(--muted);font-size:12px">今日暂无任务</p>`;
    }else{
        h+=`<div style="overflow-x:auto"><table><tr><th>任务</th><th>描述</th><th>进度</th><th>奖励</th><th>操作</th></tr>`;
        r.tasks.forEach(t=>{
            const prog=t.progress||0;
            const target=t.target_value||1;
            const done=t.is_completed;
            const pct=Math.min(100,Math.round(prog/target*100));
            h+=`<tr><td><b>${t.title}</b></td><td>${t.description}</td>
            <td><div class="progress-bar" style="width:80px;height:16px"><div class="fill" style="width:${pct}%;background:${done?'var(--green)':'var(--accent)'}"></div><div class="label" style="font-size:9px">${prog}/${target}</div></div></td>
            <td>🪙${t.reward_gold} ⭐${t.reward_score}</td>
            <td>${done?`<button class="btn btn-sm btn-gold" onclick="claimTask(${t.id})">领取</button>`:'进行中'}</td></tr>`;
        });
        h+=`</table></div>`;
    }
    h+=`</div>`;
    document.getElementById('panel-tasks').innerHTML=h;
}
async function claimTask(id){const r=await api('/daily_tasks/'+id+'/claim',{method:'POST'});if(r){showToast(r.msg||'领取成功');loadDailyTasks();loadColony()}}

// ============ V8: 战争纪元 Loader函数 ============
let warTab='raid', selectedFormation='balanced';

async function loadWar(){
    const fatigue=await api('/raid/fatigue');
    const reports=await api('/reports/unread_count');
    let h=`<div class="card"><h3>⚔️ 战争纪元</h3>
        <div style="margin:4px 0;font-size:12px;color:var(--muted)">
            ⏱️ 冷却: ${fatigue?.cooldown_remaining||0}秒 | 疲劳: ${fatigue?.fatigue_penalty||1}x | 🔄 复仇令牌: ${fatigue?.revenge_tokens||0} | 📬 未读战报: <span style="color:var(--red)">${reports?.unread_reports||0}</span>
        </div>
        <div class="tab-bar">
            <span class="tab-btn ${warTab==='raid'?'active':''}" onclick="warTab='raid';loadWar()">🗡️ 袭击</span>
            <span class="tab-btn ${warTab==='defense'?'active':''}" onclick="warTab='defense';loadWar()">🛡️ 防御</span>
            <span class="tab-btn ${warTab==='reports'?'active':''}" onclick="warTab='reports';loadWar()">📰 战报</span>
            <span class="tab-btn ${warTab==='factionwar'?'active':''}" onclick="warTab='factionwar';loadWar()">🏴 派系战</span>
        </div></div>`;
    if(warTab==='raid'){
        h+=await loadRaidTab();
    } else if(warTab==='defense'){
        h+=await loadDefenseTab();
    } else if(warTab==='reports'){
        h+=await loadReportsTab();
    } else if(warTab==='factionwar'){
        h+=await loadFactionWarTab();
    }
    document.getElementById('panel-war').innerHTML=h;
}

async function loadRaidTab(){
    const r=await api('/raid/targets');
    if(!r)return '<div class="card">加载失败</div>';
    let h=`<div class="card"><h3>🎯 选择目标</h3>
        <div style="margin:6px 0">
            <b>阵型:</b>
            <span class="formation-btn ${selectedFormation==='balanced'?'selected':''}" onclick="selectedFormation='balanced';loadWar()">⚖️ 均衡</span>
            <span class="formation-btn ${selectedFormation==='assault'?'selected':''}" onclick="selectedFormation='assault';loadWar()">⚡ 突击(+30%攻)</span>
            <span class="formation-btn ${selectedFormation==='siege'?'selected':''}" onclick="selectedFormation='siege';loadWar()">🔥 攻城(+掠夺)</span>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">我的攻击力: ${r.my_power}</div>`;
    (r.targets||[]).forEach(t=>{
        const ratio=r.my_power/Math.max(1,t.defense_power);
        const chance=ratio>1.5?'🟢高':ratio>0.8?'🟡中':'🔴低';
        const shield=t.has_shield?'<span class="shield-badge">🛡️护盾</span>':'';
        const bounty=t.bounty_amount>0?`<span style="color:var(--gold)">💀${t.bounty_amount}金</span>`:'';
        h+=`<div class="raid-target ${t.bounty_amount>0?'has-bounty':''}" onclick="launchRaid(${t.id})">
            <div><b>${t.name}</b> <small>Lv${t.level}</small> ${shield} ${bounty}</div>
            <div style="font-size:12px">⚔️${t.attack_power} 🛡️${t.defense_power} ${chance}</div>
        </div>`;
    });
    h+=`</div>`;
    return h;
}

async function launchRaid(targetId){
    if(!confirm('确认发起袭击?'))return;
    const r=await api('/raid/launch','POST',{target_id:targetId,formation:selectedFormation});
    if(!r)return;
    if(r.result==='blocked'||r.result==='shielded'){
        toast(r.msg||'无法袭击');return;
    }
    let msg=r.result==='win'?`⚔️ 袭击成功! 掠夺${r.loot_pct}%资源`:'💀 袭击失败';
    if(r.loot&&Object.keys(r.loot).length>0){
        msg+=' | '+Object.entries(r.loot).map(([k,v])=>`${k}:${v}`).join(' ');
    }
    toast(msg);
    loadWar();
}

async function loadDefenseTab(){
    const r=await api('/defenses');
    if(!r)return '<div class="card">加载失败</div>';
    let h=`<div class="card"><h3>🛡️ 防御工事</h3>
        <div style="margin:6px 0"><b>防御阵型:</b> `;
    Object.entries(r.defense_formations||{}).forEach(([k,v])=>{
        h+=`<span class="formation-btn ${r.formation===k?'selected':''}" onclick="setDefFormation('${k}')">${v.name}</span> `;
    });
    h+=`</div>`;
    if(r.shield&&r.shield.shield_type!=='none'){
        h+=`<div style="margin:4px 0"><span class="shield-badge">🛡️ 护盾生效中 (剩余${r.shield.shield_charges}次)</span></div>`;
    } else {
        h+=`<div style="margin:4px 0"><button class="btn btn-primary btn-sm" onclick="activateShield()">激活护盾(100暗物质/8h)</button></div>`;
    }
    h+=`<div class="grid2" style="margin-top:6px">`;
    for(let i=0;i<5;i++){
        const d=(r.defenses||[]).find(x=>x.slot===i);
        if(d){
            const cfg=(r.defense_types||{})[d.defense_type]||{};
            h+=`<div class="defense-slot occupied"><b>${cfg.name||d.defense_type}</b> Lv${d.level}<br>
                <small>HP:${d.hp}/${d.max_hp} 防+${d.level*cfg.def}</small><br>
                <button class="btn btn-sm btn-primary" onclick="upgradeDefense(${d.id})">升级</button>
                ${d.hp<d.max_hp?`<button class="btn btn-sm btn-gold" onclick="repairDefense(${d.id})">修复</button>`:''}
            </div>`;
        } else {
            h+=`<div class="defense-slot"><small>空槽位 #${i}</small><br><select id="def-type-${i}" style="font-size:10px">
                <option value="trap">陷阱阵(30矿20能)</option>
                <option value="laser_turret">激光炮塔(60矿40能)</option>
                <option value="missile_silo">导弹井(80矿50能)</option>
                <option value="shield_gen">护盾发生器(100矿80能)</option>
                <option value="autocannon">自动炮台(50矿30能)</option>
            </select><br><button class="btn btn-sm btn-accent2" onclick="buildDefense(${i})">建造</button></div>`;
        }
    }
    h+=`</div></div>`;
    return h;
}

async function setDefFormation(f){
    await api('/defenses/formation','POST',{formation:f});
    toast(`防御阵型已切换`);loadWar();
}
async function activateShield(){
    await api('/raid/shield/activate','POST',{shield_type:'attack'});
    toast('护盾已激活!');loadWar();
}
async function buildDefense(slot){
    const sel=document.getElementById('def-type-'+slot);
    const type=sel?sel.value:'trap';
    await api('/defenses/build','POST',{defense_type:type,slot});
    toast('防御工事建造成功!');loadWar();
}
async function upgradeDefense(id){
    await api('/defenses/upgrade/'+id,'POST',{});toast('升级成功!');loadWar();
}
async function repairDefense(id){
    await api('/defenses/repair/'+id,'POST',{});toast('修复完成!');loadWar();
}

async function loadReportsTab(){
    const r=await api('/reports');
    if(!r)return '<div class="card">加载失败</div>';
    let h=`<div class="card"><h3>📰 战报</h3>`;
    (r.reports||[]).forEach(rp=>{
        const isWin=rp.result==='win';
        h+=`<div class="battle-report ${isWin?'victory':''} ${rp.is_read?'':'unread'}" onclick="viewReport(${rp.id})">
            <span style="color:${isWin?'var(--green)':'var(--red)'}">${isWin?'✅胜':'❌败'}</span>
            ${rp.report_type==='revenge'?'🔄复仇':''} ${rp.attacker_name} vs ${rp.defender_name}
            <small style="color:var(--muted)">${new Date(rp.created_at).toLocaleString()}</small>
        </div>`;
    });
    h+=`</div>`;
    return h;
}

async function viewReport(id){
    const rp=await api('/reports/'+id);
    if(!rp)return;
    let phases='';
    try{
        const ps=typeof rp.battle_phases_json==='string'?JSON.parse(rp.battle_phases_json):rp.battle_phases_json;
        (ps||[]).forEach(p=>{
            const cls=p.phase==='loot'||p.phase==='defend'?(rp.result==='win'?'win':'lose'):'shield';
            phases+=`<div class="phase-step ${cls}">${p.desc}</div>`;
        });
    }catch(e){}
    let lootStr='';
    try{
        const loot=typeof rp.loot_json==='string'?JSON.parse(rp.loot_json):rp.loot_json;
        if(loot&&Object.keys(loot).length>0) lootStr=Object.entries(loot).map(([k,v])=>`${k}:${v}`).join(' ');
    }catch(e){}
    let h=`<div class="card"><h3>📋 战报详情</h3>
        <p>⚔️ ${rp.attacker_name} (${rp.attacker_formation||'均衡'}) vs 🛡️ ${rp.defender_name} (${rp.defender_formation||'堡垒'})</p>
        <p>攻${rp.attacker_power} vs 守${rp.defender_power} → <span style="color:${rp.result==='win'?'var(--green)':'var(--red)'}">${rp.result==='win'?'胜利':'失败'}</span></p>
        ${phases?`<div class="phase-timeline">${phases}</div>`:''}
        ${lootStr?`<p style="color:var(--gold)">掠夺: ${lootStr}</p>`:''}
        <button class="btn btn-sm btn-danger" onclick="loadWar()">← 返回</button></div>`;
    document.getElementById('panel-war').innerHTML=h;
}

async function loadFactionWarTab(){
    const wars=await api('/wars/active');
    let h=`<div class="card"><h3>🏴 派系战争</h3>`;
    if(!wars||!wars.wars||wars.wars.length===0){
        h+=`<p style="color:var(--muted)">当前没有活跃的派系战争</p>`;
    }
    (wars?.wars||[]).forEach(w=>{
        const total=w.attacker_score+w.defender_score||1;
        const aPct=Math.round(w.attacker_score/total*100);
        h+=`<div style="margin:6px 0">
            <div><b>${w.attacker_name}</b> vs <b>${w.defender_name}</b></div>
            <div class="war-score-bar">
                <div class="atk-score" style="width:${aPct}%">${w.attacker_score}</div>
                <div class="def-score" style="width:${100-aPct}%">${w.defender_score}</div>
            </div>
            <small style="color:var(--muted)">${w.war_type} | ${new Date(w.started_at).toLocaleDateString()}</small>
        </div>`;
    });
    h+=`</div>`;
    return h;
}

// ============ V8: 通知中心 ============
async function toggleNotif(){
    const dd=document.getElementById('notif-dropdown');
    if(dd.style.display==='block'){dd.style.display='none';return;}
    dd.style.display='block';
    const r=await api('/notifications');
    const ur=await api('/reports/unread_count');
    let h=`<div style="padding:6px;border-bottom:1px solid var(--border);font-size:11px;color:var(--accent);font-weight:bold">📬 通知中心 (${ur?.unread_reports||0}条未读战报)</div>`;
    (r||[]).slice(0,15).forEach(n=>{
        h+=`<div class="notif-item ${n.is_read?'':'unread'}">
            <b>${n.title}</b><br><small>${n.content}</small><br><small style="color:var(--muted)">${new Date(n.created_at).toLocaleString()}</small></div>`;
    });
    dd.innerHTML=h;
}

// 更新未读计数
async function updateNotifCount(){
    const r=await api('/reports/unread_count');
    if(r&&(r.unread_reports>0||r.unread_notifications>0)){
        const total=(r.unread_reports||0)+(r.unread_notifications||0);
        const badge=document.getElementById('notif-count');
        if(badge){badge.textContent=total;badge.style.display=total>0?'inline':'none';}
    }
}

(function(){
    const t=localStorage.getItem('sc_token'),u=localStorage.getItem('sc_uid');
    if(t&&u){
        token=t;uid=u;
        // 验证token是否有效
        fetch(API+'/colony',{headers:{'Authorization':'Bearer '+token}})
        .then(r=>{
            if(r.status===401){
                // token失效，清除并显示登录

                document.getElementById('login-screen').style.display='block';
                document.getElementById('game-content').style.display='none';
            } else {
                enterGame();
            }
        })
        .catch(()=>{
            token='';uid=0;localStorage.removeItem('sc_token');localStorage.removeItem('sc_uid');
        });
    }
})();
